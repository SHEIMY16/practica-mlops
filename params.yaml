prepare:
  target: air_temperature_2m                # columna que se quiere predecir
  drop_columns: [customerID]   # identificadores o columnas que no aportan
  test_size: 0.2
  random_state: 42
  # pivot params
  index: observed_at
  columns: variable
  values: value

train:
  n_estimators: 100
  max_depth: 5

mlflow:
  experiment: integrador-equipo-X   # cambiar X por el nombre del equipo
  model_name: modelo-equipo-X
